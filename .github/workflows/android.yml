name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Build APKs
        run: ./gradlew assemblePlayStoreRelease assemblePlayStoreDebug
      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wearauthn-apks
          path: |
            authenticator/build/outputs/apk/**/*.apk
            companion/build/outputs/apk/**/*.apk
