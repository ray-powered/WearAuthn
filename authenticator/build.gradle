apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    compileSdk 34

    kotlinOptions {
        freeCompilerArgs = ["-opt-in=kotlin.ExperimentalUnsignedTypes"]
        jvmTarget = "1.8"
    }
    signingConfigs {
        testSign {
            storeFile file('../ci_keystore.jks')
            storePassword 'hunter2'
            keyAlias 'key0'
            keyPassword 'hunter2'
        }
        nightlySign {
            def storePass = project.findProperty("storePassword")
            def keyPass = project.findProperty("keyPassword")
            if (storePass != null && !storePass.toString().isEmpty()) {
                storeFile file('../nightly_keystore.jks')
                storePassword storePass.toString()
                keyPassword (keyPass != null && !keyPass.toString().isEmpty()) ? keyPass.toString() : storePass.toString()
            } else {
                storeFile file('../ci_keystore.jks')
                storePassword 'hunter2'
                keyPassword 'hunter2'
            }
            keyAlias 'key0'
        }
    }
    defaultConfig {
        applicationId "me.henneke.wearauthn.authenticator"
        minSdk 28
        targetSdk 33
        versionCode makeVersionCode(minSdkVersion.apiLevel, true)
        versionName makeVersionName()
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.testSign
        }
        debug {
            minifyEnabled false
        }
        signed {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.nightlySign
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        playStore {
            dimension "distribution"
        }
        nightly {
            dimension "distribution"
            applicationIdSuffix ".nightly"
            versionCode getNightlyVersionCode()
            versionName getNightlyVersionName()
        }
    }
    namespace 'me.henneke.wearauthn'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    applicationVariants.configureEach { variant ->
        variant.resValue "string", "application_id", variant.applicationId
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.wear:wear:1.3.0'

    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    implementation 'androidx.wear.compose:compose-material:1.3.0'
    implementation 'androidx.wear.compose:compose-foundation:1.3.0'
    implementation 'androidx.wear.compose:compose-navigation:1.3.0'

    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.1'
    testImplementation 'io.kotlintest:kotlintest-runner-junit5:3.4.2'
    testImplementation 'org.slf4j:slf4j-nop:2.0.0-alpha1'
}
